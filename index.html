<title>Apple Alım Satım – Stok ve Kasa</title>
<style>
:root{--bg:#0b0b0c;--s1:#151517;--s2:#1e1e21;--line:#2b2b2f;--tx:#f3f3f5;--mu:#8e8e96;--gold:#f4b73c;--gold2:#c98a12;--gr:#3ecf8e;--rd:#ff6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:15px}
body{padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 92px)}
.wrap{max-width:560px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 2px 12px}
h1{font-size:19px;margin:0;font-weight:800;letter-spacing:.2px}
h1 span{color:var(--gold)}
.badge{font-size:11.5px;padding:4px 9px;border-radius:99px;background:var(--s2);color:var(--mu);white-space:nowrap}
.badge.ok{color:var(--gr)}.badge.warn{color:var(--gold)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.big{background:linear-gradient(160deg,#1d1810,#151517 60%);border-color:#3a2f17}
.row{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0}
.row+.row{border-top:1px solid var(--line)}
.lbl{color:var(--mu);font-size:13px}
.val{font-weight:700;font-variant-numeric:tabular-nums}
.net{font-size:28px;font-weight:800}
.gr{color:var(--gr)}.rd{color:var(--rd)}.gd{color:var(--gold)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.grid .card{margin:0}
.grid .val{font-size:19px;display:block;margin-top:4px}
.note{color:var(--mu);font-size:12px;line-height:1.45;margin-top:8px}
h2{font-size:14px;margin:4px 2px 8px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{color:var(--mu);font-weight:600;text-align:right;padding:6px 4px}
td{padding:8px 4px;text-align:right;border-top:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
input,select,textarea{width:100%;background:var(--s2);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;font-family:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.search{margin-bottom:10px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 -2px 10px;padding:0 2px 2px}
.chip{flex:none;background:var(--s1);border:1px solid var(--line);color:var(--mu);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:600}
.chip.on{background:var(--gold);border-color:var(--gold);color:#1a1200}
.tog{display:flex;align-items:center;gap:8px;color:var(--mu);font-size:13px;margin:0 2px 12px}
.tog input{width:auto}
.grp{background:var(--s1);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden}
.gh{display:flex;align-items:center;gap:10px;padding:12px 12px;cursor:pointer}
.gh .nm{flex:1;font-weight:700}
.gh .ct{background:var(--gold);color:#1a1200;font-weight:800;border-radius:99px;min-width:26px;text-align:center;padding:2px 8px;font-size:13px}
.gh .ct.z{background:var(--s2);color:var(--mu)}
.gh .sub{color:var(--mu);font-size:12px}
.plus{border:1px solid var(--line);background:var(--s2);color:var(--gold);border-radius:10px;width:32px;height:32px;font-size:20px;line-height:1;cursor:pointer}
.it{padding:10px 12px;border-top:1px solid var(--line);cursor:pointer}
.it .t{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.it .s{color:var(--mu);font-size:12.5px;margin-top:3px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.mono{font-family:ui-monospace,Menlo,monospace;letter-spacing:.3px}
.empty{text-align:center;color:var(--mu);padding:34px 10px;line-height:1.6}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(15,15,17,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 14px calc(env(safe-area-inset-bottom) + 8px);z-index:5}
nav .in{display:flex;max-width:560px;width:100%;gap:6px}
nav button{flex:1;background:none;border:0;color:var(--mu);font-size:13px;padding:8px 4px;border-radius:12px;font-weight:600}
nav button.on{color:var(--gold);background:var(--s2)}
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 78px);width:56px;height:56px;border-radius:50%;border:0;background:linear-gradient(145deg,var(--gold),var(--gold2));color:#1a1200;font-size:32px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.5);z-index:6}
.btn{border:0;border-radius:12px;padding:13px 16px;font-size:15px;font-weight:700;width:100%;background:var(--s2);color:var(--tx);border:1px solid var(--line)}
.btn.pri{background:linear-gradient(145deg,var(--gold),var(--gold2));color:#1a1200;border:0}
.btn.dng{color:var(--rd)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:20;display:none}
.ov.on{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:94%;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;border:1px solid var(--line);padding:16px 14px calc(env(safe-area-inset-bottom) + 20px);max-width:560px;margin:0 auto}
.sheet h3{margin:0 0 12px;font-size:17px}
.f{margin-bottom:11px}
.f label{display:block;color:var(--mu);font-size:12.5px;margin:0 0 5px 2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sec{color:var(--gold);font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin:16px 2px 8px;padding-top:12px;border-top:1px solid var(--line)}
.hint{font-size:12px;margin:5px 2px 0;min-height:15px}
.acts{display:grid;gap:8px;margin-top:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 150px);background:#2a2a2e;color:var(--tx);padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1> <span>Apple</span> Alım Satım</h1>
    <span id="badge" class="badge ok">Bu telefonda kayıtlı</span>

  <div id="view"></div>

  <button data-tab="satilan">Satılanlar</button>
</div></nav>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

let phones=[],tab="ozet",q="",showAll=false,editing=null,saving=false,fcat="all";

const LS="iphone-takip-v1";
function lsLoad(){try{return JSON.parse(localStorage.getItem(LS)||"[]")}catch(e){return[]}}

const LSB="iphone-takip-yedek";

async function persist(p){

function ozetHTML(){

  </div>

  </div>

  <div class="card">${keys.length?`<table><tr><th>Ay</th><th>Alış+masraf</th><th>Satış</th><th>Kâr</th></tr>${keys.map(k=>{const o=months[k];return `<tr><td>${AYLAR[+k.slice(5)-1]} ${k.slice(2,4)}</td><td>${money(o.a)}</td><td>${money(o.s)}</td><td class="${clsP(o.k)}">${money(o.k)}</td></tr>`}).join("")}</table>`:`<div class="empty">Henüz kayıt yok. Stok sekmesinden “+” ile ilk ürünü ekle.</div>`}</div>

  <input type="file" id="fFile" accept=".json,application/json" style="display:none">`;
}

function backupNote(){
  let t=null;try{t=localStorage.getItem(LSB)}catch(e){}
  if(!t)return "Henüz yedek alınmadı. Telefon değişirse veya tarayıcı verisi silinirse kayıtlar gider; arada bir yedek al ve dosyayı Dosyalar'a / iCloud'a kaydet.";
  const days=Math.floor((Date.now()-new Date(t).getTime())/864e5);
  return "Son yedek: "+fmtD(t)+(days>=14?" — yedek almanın zamanı geldi.":".");
}
async function saveFile(name,text,mime){
  const blob=new Blob([text],{type:mime});
  try{
    const f=new File([blob],name,{type:mime});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return true}
  }catch(e){if(e&&e.name==="AbortError")return false}
  const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return true;
}
async function backup(){
  if(await saveFile("apple-yedek-"+today()+".json",JSON.stringify({v:1,phones}),"application/json")){
    try{localStorage.setItem(LSB,today())}catch(e){}
    render();toast("Yedek hazır")}
}
function restore(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);if(!d||!Array.isArray(d.phones))throw 0;
      const m={};phones.forEach(p=>m[p.id]=p);d.phones.forEach(p=>{if(p&&p.id&&p.model)m[p.id]=p});
      phones=Object.values(m);
      if(!lsSave())throw 1;
      render();toast(d.phones.length+" kayıt yüklendi");
    }catch(e){toast("Yedek dosyası okunamadı")}
  };
  r.readAsText(file);
}
function match(p,t){
  if(!t)return true;t=t.toLowerCase();
  return [p.model,GB(p.hafiza),p.renk,p.imei,p.kisiAd,p.kisiTel,p.aliciAd,p.kaynak].some(x=>String(x||"").toLowerCase().includes(t));
}
function itemHTML(p){

    <div class="s"><span class="mono">${p.imei?esc(p.imei):"IMEI/Seri yok"}</span><span>${esc(p.kaynak||"")}${p.kisiAd?" · "+esc(p.kisiAd):""} · ${fmtD(p.alisTarih)}</span></div>
  </div>`;
}
function stokHTML(){
  const stock=phones.filter(p=>!isSold(p)&&(fcat==="all"||catOf(p)===fcat)&&match(p,q));
  const by={};stock.forEach(p=>(by[p.model]||(by[p.model]=[])).push(p));
  const names=Object.keys(by);
  if(showAll&&!q)MODELS.forEach(m=>{if((fcat==="all"||m.cat===fcat)&&!by[m.name])by[m.name]=[]});
  const all=Object.keys(by).sort((a,b)=>(MIDX[a]??999)-(MIDX[b]??999)||a.localeCompare(b));
  if(!all.length)return `<div class="empty">${q?"Sonuç yok.":"Stokta ürün yok.<br>Sağ alttaki “+” ile yeni ürün ekle."}</div>`;
  return all.map(n=>{
    const l=by[n],c=l.reduce((a,p)=>a+cost(p),0),isOpen=open.has(n)||!!q;
    return `<div class="grp"><div class="gh" data-act="tg" data-model="${esc(n)}">

      <span class="ct ${l.length?"":"z"}">${l.length}</span>
      <button class="plus" data-act="addm" data-model="${esc(n)}" aria-label="${esc(n)} ekle">+</button></div>
      ${isOpen?l.slice().sort((a,b)=>(b.alisTarih||"").localeCompare(a.alisTarih||"")).map(itemHTML).join(""):""}</div>`;
  }).join("");
}
function satilanHTML(){
  const l=phones.filter(p=>isSold(p)&&(fcat==="all"||catOf(p)===fcat)&&match(p,q)).sort((a,b)=>(b.satisTarih||"").localeCompare(a.satisTarih||""));
  if(!l.length)return `<div class="empty">${q?"Sonuç yok.":"Henüz satış yok.<br>Stoktan bir ürünü açıp satış fiyatını girince burada görünür."}</div>`;

    <div class="s"><span>${p.aliciAd?esc(p.aliciAd):"Alıcı yazılmadı"}</span><span>${fmtD(p.satisTarih)}</span></div></div></div>`).join("");
}

async function saveForm(){

  const st=$("fSt").value,kat=$("fCat").value;
  const old=editing?phones.find(x=>x.id===editing):null;
  const p={id:editing||("p"+Date.now().toString(36)+Math.random().toString(36).slice(2,5)),
    kat,model,hafiza:st===""?"":(isNaN(+st)?st:+st),renk:$("fRenk").value.trim(),imei:cleanId($("fImei").value,kat),
    kaynak:$("fKaynak").value,kisiAd:$("fKisi").value.trim(),kisiTel:$("fKisiT").value.trim(),kisiNot:$("fNot").value.trim(),
    alisFiyat:alis,alisTarih:$("fAlisT").value,masraf:numOrNull($("fMasraf").value)||0,hedefFiyat:numOrNull($("fHedef").value),
    satisFiyat:satis,satisTarih:satis!=null?satisT:"",aliciAd:$("fAlici").value.trim(),aliciTel:$("fAliciT").value.trim(),
    olusturma:old?old.olusturma:Date.now()};
  saving=true;err.textContent="";
  try{await persist(p);closeForm();toast(satis!=null?"Satış kaydedildi":"Kaydedildi")}
  catch(e){err.textContent="Kaydedilemedi, tekrar dene."}
  saving=false;
}

// ---------- CSV ----------
function cell(s){s=String(s==null?"":s);if(/^[=+\-@]/.test(s))s="'"+s;return /[;"\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
async function exportCsv(){
  const H=["Durum","Tür","Model","Hafıza/Boyut","Renk","IMEI/Seri","Nereden","Kimden aldım","Telefon","Not","Alış tarihi","Alış fiyatı","Masraf","Hedef fiyat","Satış tarihi","Satış fiyatı","Alıcı","Alıcı telefon","Kâr"];
  const rows=phones.slice().sort((a,b)=>(b.alisTarih||"").localeCompare(a.alisTarih||"")).map(p=>[
    isSold(p)?"Satıldı":"Stokta",CAT[catOf(p)].ad,p.model,GB(p.hafiza),p.renk,null,p.kaynak,p.kisiAd,p.kisiTel,p.kisiNot,fmtD(p.alisTarih),p.alisFiyat,p.masraf,p.hedefFiyat,fmtD(p.satisTarih),p.satisFiyat,p.aliciAd,p.aliciTel,isSold(p)?profit(p):""]
    .map((x,i)=>i===5?(p.imei?`"=""${p.imei}"""`:""):cell(x)).join(";"));
  const csv="﻿"+[H.map(cell).join(";")].concat(rows).join("\r\n");
  if(await saveFile("apple-stok-"+today()+".csv",csv,"text/csv"))toast("Hazır");
}

// ---------- olaylar ----------
document.addEventListener("click",e=>{
  const cb=e.target.closest("[data-cat]");if(cb){fcat=cb.dataset.cat;render();return}
  const tb=e.target.closest("[data-tab]");if(tb){tab=tb.dataset.tab;q="";render();window.scrollTo(0,0);return}
  const a=e.target.closest("[data-act]");if(!a)return;
  const act=a.dataset.act;
  if(act==="new")openForm(null);
  else if(act==="addm"){e.stopPropagation();openForm(null,a.dataset.model)}
  else if(act==="tg"){const n=a.dataset.model;open.has(n)?open.delete(n):open.add(n);renderList()}
  else if(act==="edit")openForm(a.dataset.id);
  else if(act==="save")saveForm();
  else if(act==="close")closeForm();
  else if(act==="del"){
    if(a.dataset.sure){remove(editing).then(()=>{closeForm();toast("Silindi")}).catch(()=>$("errH").textContent="Silinemedi.")}
    else{a.dataset.sure="1";a.textContent="Emin misin? Silmek için tekrar dokun"}
  }
  else if(act==="csv")exportCsv();
  else if(act==="bak")backup();
  else if(act==="geri")$("fFile").click();
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="q"){q=t.value;renderList()}
  else if(t.closest("#sheet"))formHints();
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="fFile"){if(t.files[0])restore(t.files[0]);t.value=""}
  else if(t.id==="showAll"){showAll=t.checked;renderList()}
  else if(t.id==="fCat"){
    const c=t.value;$("fModel").innerHTML=modelOpts(c,"");$("fModelC").style.display="none";
    $("fSt").innerHTML=stOpts("","",c);syncCat();formHints();
  }
  else if(t.id==="fModel"){
    const c=$("fCat").value;
    $("fModelC").style.display=t.value==="__c"?"block":"none";
    $("fSt").innerHTML=stOpts(t.value==="__c"?"":t.value,null,c);
  }
});
$("ov").addEventListener("click",e=>{if(e.target.id==="ov")closeForm()});
init();
</script>
</body>
</html>
